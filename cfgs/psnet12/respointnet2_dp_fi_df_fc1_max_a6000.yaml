# Optimized configuration for 2x A6000 (48GB each)
# Changes from 3090 config are marked with comments

datasets: 'psnet12'
data_root: ''
num_classes: 12
input_features_dim: 4

# CHANGED: Increased from 6 to 16 (2.67x increase)
# With 48GB VRAM, you can handle much larger batches
# 6 batch → 24GB on 3090, so 16 batch → ~64GB total, but more efficient memory usage
# Start with 16, can try 20-24 if stable
batch_size: 16 # A6000 can handle 16, ~ 43.5GB

# CHANGED: Increased from 15000 to 20000 points
# More points = better accuracy, A6000 can handle it
num_points: 15000 # try 20000

# CHANGED: Increased from 4 to 8 workers
# Better data loading throughput to feed the GPUs
num_workers: 8

# data augmentation (unchanged - these are good defaults)
x_angle_range: 0.0
y_angle_range: 0.0
z_angle_range: 3.1415926
scale_low: 0.7
scale_high: 1.3
noise_std: 0.001
noise_clip: 0.05
translate_range: 0.0
color_drop: 0.2
augment_symmetries:
  - 1
  - 0
  - 0
  
# ---------------------------------------------------------------------------- #
# Model
# ---------------------------------------------------------------------------- #
backbone: 'resnet'
head: 'resnet_scene_seg'
radius: 0.1
sampleDl: 0.04
nsamples:
  - 26
  - 31
  - 38
  - 41
  - 39
npoints:
  - 4096
  - 1152
  - 304
  - 88
width: 144
depth: 2
bottleneck_ratio: 2
in_radius: 2.0
num_steps: 2000

# ---------------------------------------------------------------------------- #
# Training options
# ---------------------------------------------------------------------------- #
epochs: 600
start_epoch: 1

# CHANGED: Scaled learning rate from 0.01 to 0.0267 (16/6 ratio)
# Linear scaling rule: new_lr = base_lr * (new_batch / old_batch)
# You may want to fine-tune this - can also try 0.025 or 0.03
base_learning_rate: 0.0267

lr_scheduler: 'step'
optimizer: 'sgd'

# CHANGED: Added warmup for larger batch size stability
# Warmup helps with larger batch sizes
warmup_epoch: 5

lr_decay_steps: 1
lr_decay_rate: 0.9885531
weight_decay: 0.001
momentum: 0.98

# ---------------------------------------------------------------------------- #
# io and misc
# ---------------------------------------------------------------------------- #
load_path: ''
print_freq: 10
save_freq: 10
val_freq: 10
log_dir: './output'
local_rank: 0

# CHANGED: Enable mixed precision training
# A6000 excels at TF32/FP16 operations - can give ~2x speedup
# Use 'O1' for conservative mixed precision or 'O2' for more aggressive
amp_opt_level: 'O1'

rng_seed: 0

# ---------------------------------------------------------------------------- #
# Local Aggregation options
# ---------------------------------------------------------------------------- #
local_aggregation_type: 'respointnet2'
respointnet2:
  feature_type: 'dp_fi_df'
  num_mlps: 1
  reduction: 'max'